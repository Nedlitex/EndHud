name: Release

# Push a tag like v1.2.0 to publish a release:
#
#   git tag v1.2.0
#   git push origin v1.2.0
#
# 1. tests    the test suite (tests.yml).
# 2. build    EndHud as a self-contained exe and an MSI installer.
# 3. verify   on a clean Windows machine: install the MSI, run the installed EndHud's self-test
#             (download the operators from the wiki and name the squad in a screenshot), the same
#             for the portable exe, then uninstall and check nothing is left behind.
# 4. release  only if all of that passed: a GitHub Release with both files.
#
# "Run workflow" on the Actions tab does a dry run: steps 1-3, with the files and the self-test
# logs attached to the run, and no release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The character recognition model is compiled in (Git LFS); the recordings aren't needed.
      - name: Fetch the character model
        run: git lfs pull --include "src/EndHud.Vision/Assets/ccip/*"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq 'tag') {
            $version = "${{ github.ref_name }}".TrimStart('v')
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Release tags look like v1.2.0 (three numbers); got '${{ github.ref_name }}'."
            }
          } else {
            # Dry run: an MSI version must be numbers only.
            $version = "0.0.${{ github.run_number }}"
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "EndHud $version"

      # One EndHud.exe with .NET included, so players don't need to install anything first.
      - name: Publish EndHud.exe
        run: >
          dotnet publish src/EndHud -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:Version=${{ env.VERSION }}
          -o out/publish

      - name: Build the installer
        run: |
          dotnet tool restore
          dotnet wix build installer/EndHud.wxs -arch x64 -define "Version=${{ env.VERSION }}" -define "PublishDir=${{ github.workspace }}\out\publish" -o "out\EndHud-${{ env.VERSION }}.msi"

      - name: Name the files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/release | Out-Null
          Move-Item "out/EndHud-$env:VERSION.msi" out/release/
          Copy-Item out/publish/EndHud.exe "out/release/EndHud-$env:VERSION-portable.exe"
          Get-ChildItem out/release | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: EndHud-${{ env.VERSION }}
          path: out/release

  verify:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.build.outputs.version }}
      # A screenshot from the test fixtures, and the squad in it.
      SCREENSHOT: tests/EndHud.Vision.Tests/Fixtures/exploration-levels-visible.png
      SQUAD: Laevatain,Camille,Arcane,Ardelia
    steps:
      - uses: actions/checkout@v4 # for the screenshot (not in LFS)

      - uses: actions/download-artifact@v4
        with:
          name: EndHud-${{ env.VERSION }}
          path: release

      # EndHud reads the squad panel with the OCR built into Windows, as on a player's machine.
      - name: Install Windows OCR (English)
        shell: pwsh
        run: |
          $name = 'Language.OCR~~~en-US~0.0.1.0'
          if ((Get-WindowsCapability -Online -Name $name).State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $name | Out-Null
          }

      - name: Install the MSI
        shell: pwsh
        run: |
          $msi = Resolve-Path "release/EndHud-$env:VERSION.msi"
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 50; throw "msiexec exited with $($p.ExitCode)" }

          $exe = "$env:LOCALAPPDATA\Programs\EndHud\EndHud.exe"
          if (-not (Test-Path $exe)) { throw "Not installed: $exe" }
          $installed = (Get-Item $exe).VersionInfo.ProductVersion
          if (-not $installed.StartsWith($env:VERSION)) { throw "Installed version $installed, expected $env:VERSION" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\EndHud.lnk")) { throw "No Start menu shortcut" }
          "Installed EndHud $installed"

      # The self-test downloads the operators from the wiki, loads them, and names the squad in
      # the screenshot; see src/EndHud/SelfTest.cs. Run as a player would: the installed exe.
      - name: Self-test the installed EndHud
        shell: pwsh
        run: ./installer/self-test.ps1 -Exe "$env:LOCALAPPDATA\Programs\EndHud\EndHud.exe" -Folder "$env:RUNNER_TEMP\self-test-msi" -Screenshot $env:SCREENSHOT -Squad $env:SQUAD

      # Same folder: the roster is already there, so the wiki is only asked what changed.
      - name: Self-test the portable exe
        shell: pwsh
        run: |
          Copy-Item -Recurse "$env:RUNNER_TEMP\self-test-msi" "$env:RUNNER_TEMP\self-test-portable"
          ./installer/self-test.ps1 -Exe (Resolve-Path "release/EndHud-$env:VERSION-portable.exe") -Folder "$env:RUNNER_TEMP\self-test-portable" -Screenshot $env:SCREENSHOT -Squad $env:SQUAD

      - name: Uninstall
        shell: pwsh
        run: |
          $msi = Resolve-Path "release/EndHud-$env:VERSION.msi"
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /x exited with $($p.ExitCode)" }
          foreach ($left in "$env:LOCALAPPDATA\Programs\EndHud", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\EndHud.lnk", "HKCU:\Software\EndHud\Installer") {
            if (Test-Path $left) { throw "Left behind after uninstall: $left" }
          }
          "Uninstalled cleanly"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-logs
          path: |
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/self-test-*/self-test.log

  release:
    needs: [build, verify]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EndHud-${{ needs.build.outputs.version }}
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" release/*
          --repo "${{ github.repository }}"
          --title "EndHud ${{ needs.build.outputs.version }}" --generate-notes
