name: Release

# Push a tag like v1.2.0 to publish a release:
#
#   git tag v1.2.0
#   git push origin v1.2.0
#
# 1. tests    the test suite (tests.yml).
# 2. build    EndHud as a self-contained exe and an MSI installer.
# 3. verify   on a clean Windows machine: install the MSI, run the installed EndHud's self-test
#             (download the operators from the wiki and name the squad in a screenshot), the same
#             for the portable exe, then uninstall and check nothing is left behind.
#    update   on another clean machine: install an old EndHud (0.0.1, built from the same code),
#             and let it update itself to this release from a stand-in for GitHub, as a player's
#             "update now" does; the same for the portable exe.
# 4. release  only if all of that passed: a GitHub Release with both files.
#
# Release versions must be above 0.0.1 (the old build the update test starts from).
# "Run workflow" on the Actions tab does a dry run: steps 1-3, with the files and the logs
# attached to the run, and no release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The character recognition model is compiled in (Git LFS); the recordings aren't needed.
      - name: Fetch the character model
        run: git lfs pull --include "src/EndHud.Vision/Assets/ccip/*"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq 'tag') {
            $version = "${{ github.ref_name }}".TrimStart('v')
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Release tags look like v1.2.0 (three numbers); got '${{ github.ref_name }}'."
            }
            if ([version]$version -le [version]'0.0.1') {
              throw "Release versions must be above 0.0.1, the old build the update test starts from."
            }
          } else {
            # Dry run: an MSI version must be numbers only.
            $version = "0.1.${{ github.run_number }}"
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "EndHud $version"

      # One EndHud.exe with .NET included, so players don't need to install anything first.
      - name: Publish EndHud.exe
        run: >
          dotnet publish src/EndHud -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:Version=${{ env.VERSION }}
          -o out/publish

      - name: Build the installer
        run: |
          dotnet tool restore
          dotnet wix build installer/EndHud.wxs -arch x64 -define "Version=${{ env.VERSION }}" -define "PublishDir=${{ github.workspace }}\out\publish" -o "out\EndHud-${{ env.VERSION }}.msi"

      - name: Name the files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/release | Out-Null
          Move-Item "out/EndHud-$env:VERSION.msi" out/release/
          Copy-Item out/publish/EndHud.exe "out/release/EndHud-$env:VERSION-portable.exe"
          Get-ChildItem out/release | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: EndHud-${{ env.VERSION }}
          path: out/release

      # The same code as an old version, for the update job to update from.
      - name: Build an old EndHud (0.0.1) to update from
        run: |
          dotnet publish src/EndHud -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=0.0.1 -o out/old/publish
          dotnet wix build installer/EndHud.wxs -arch x64 -define "Version=0.0.1" -define "PublishDir=${{ github.workspace }}\out\old\publish" -o "out\old\EndHud-0.0.1.msi"
          Copy-Item out/old/publish/EndHud.exe out/old/EndHud-0.0.1-portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: EndHud-0.0.1-update-test
          path: |
            out/old/EndHud-0.0.1.msi
            out/old/EndHud-0.0.1-portable.exe

  verify:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.build.outputs.version }}
      # A screenshot from the test fixtures, and the squad in it.
      SCREENSHOT: tests/EndHud.Vision.Tests/Fixtures/exploration-levels-visible.png
      SQUAD: Laevatain,Camille,Arcane,Ardelia
    steps:
      - uses: actions/checkout@v4 # for the screenshot (not in LFS)

      - uses: actions/download-artifact@v4
        with:
          name: EndHud-${{ env.VERSION }}
          path: release

      # EndHud reads the squad panel with the OCR built into Windows, as on a player's machine.
      - name: Install Windows OCR (English)
        shell: pwsh
        run: |
          $name = 'Language.OCR~~~en-US~0.0.1.0'
          if ((Get-WindowsCapability -Online -Name $name).State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $name | Out-Null
          }

      - name: Install the MSI
        shell: pwsh
        run: |
          $msi = Resolve-Path "release/EndHud-$env:VERSION.msi"
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 50; throw "msiexec exited with $($p.ExitCode)" }

          $exe = "$env:LOCALAPPDATA\Programs\EndHud\EndHud.exe"
          if (-not (Test-Path $exe)) { throw "Not installed: $exe" }
          $installed = (Get-Item $exe).VersionInfo.ProductVersion
          if (-not $installed.StartsWith($env:VERSION)) { throw "Installed version $installed, expected $env:VERSION" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\EndHud.lnk")) { throw "No Start menu shortcut" }
          "Installed EndHud $installed"

      # The self-test downloads the operators from the wiki, loads them, and names the squad in
      # the screenshot; see src/EndHud/SelfTest.cs. Run as a player would: the installed exe.
      - name: Self-test the installed EndHud
        shell: pwsh
        run: ./installer/self-test.ps1 -Exe "$env:LOCALAPPDATA\Programs\EndHud\EndHud.exe" -Folder "$env:RUNNER_TEMP\self-test-msi" -Screenshot $env:SCREENSHOT -Squad $env:SQUAD

      # Same folder: the roster is already there, so the wiki is only asked what changed.
      - name: Self-test the portable exe
        shell: pwsh
        run: |
          Copy-Item -Recurse "$env:RUNNER_TEMP\self-test-msi" "$env:RUNNER_TEMP\self-test-portable"
          ./installer/self-test.ps1 -Exe (Resolve-Path "release/EndHud-$env:VERSION-portable.exe") -Folder "$env:RUNNER_TEMP\self-test-portable" -Screenshot $env:SCREENSHOT -Squad $env:SQUAD

      - name: Uninstall
        shell: pwsh
        run: |
          $msi = Resolve-Path "release/EndHud-$env:VERSION.msi"
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /x exited with $($p.ExitCode)" }
          foreach ($left in "$env:LOCALAPPDATA\Programs\EndHud", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\EndHud.lnk", "HKCU:\Software\EndHud\Installer") {
            if (Test-Path $left) { throw "Left behind after uninstall: $left" }
          }
          "Uninstalled cleanly"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-logs
          path: |
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/self-test-*/self-test.log

  update:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.build.outputs.version }}
      FEED: http://127.0.0.1:8765/latest.json
    steps:
      - uses: actions/checkout@v4 # for the screenshot and installer/self-test.ps1

      - uses: actions/download-artifact@v4
        with:
          name: EndHud-${{ env.VERSION }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: EndHud-0.0.1-update-test
          path: old

      # Answers like GitHub's latest-release API (tag, page, files with their SHA-256), serving
      # this release's files from this machine. EndHud only takes plain HTTP from this computer.
      - name: Stand in for GitHub
        shell: pwsh
        run: |
          $assets = Get-ChildItem release | ForEach-Object { @{
            name = $_.Name
            browser_download_url = "http://127.0.0.1:8765/$($_.Name)"
            digest = "sha256:" + (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
          } }
          @{ tag_name = "v$env:VERSION"; html_url = "https://github.com/${{ github.repository }}/releases"; assets = @($assets) } |
            ConvertTo-Json -Depth 4 | Set-Content release/latest.json
          Get-Content release/latest.json
          Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', (Resolve-Path release) -WindowStyle Hidden
          Start-Sleep 3
          (Invoke-WebRequest $env:FEED).StatusCode

      - name: Install EndHud 0.0.1
        shell: pwsh
        run: |
          $p = Start-Process msiexec -ArgumentList "/i `"$(Resolve-Path old/EndHud-0.0.1.msi)`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec exited with $($p.ExitCode)" }
          (Get-Item "$env:LOCALAPPDATA\Programs\EndHud\EndHud.exe").VersionInfo.ProductVersion

      # What "update now" does, without the tray: download, verify, install quietly.
      - name: The installed EndHud updates itself
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\EndHud\EndHud.exe"
          $work = Join-Path ([IO.Path]::GetTempPath()) 'EndHud-update'
          $p = Start-Process $exe -ArgumentList '--update-now', '--from', $env:FEED -Wait -PassThru
          Get-Content "$work\update-now.log"
          if ($p.ExitCode -ne 0) { throw "--update-now exited with $($p.ExitCode)" }

          # The installer runs once EndHud has exited; it writes its exit code when done.
          $deadline = (Get-Date).AddMinutes(5)
          while (-not (Test-Path "$work\install-result.txt")) {
            if ((Get-Date) -gt $deadline) { throw 'The installer did not finish within 5 minutes' }
            Start-Sleep 2
          }
          $result = (Get-Content "$work\install-result.txt").Trim()
          if ($result -ne '0') { Get-Content "$work\install.log" -Tail 60; throw "msiexec exited with $result" }

          $installed = (Get-Item $exe).VersionInfo.ProductVersion
          if (-not $installed.StartsWith($env:VERSION)) { throw "Installed version $installed, expected $env:VERSION" }
          # Exactly one EndHud registered with Windows, at the new version (the MSI replaced the old one).
          $msi = New-Object -ComObject WindowsInstaller.Installer
          $products = @($msi.RelatedProducts('{DE14780C-8881-4E6D-A8A7-7227CF00E8EE}'))
          $versions = @($products | ForEach-Object { $msi.ProductInfo($_, 'VersionString') })
          "Registered: $($versions -join ', ')"
          if ($products.Count -ne 1 -or $versions[0] -ne $env:VERSION) { throw "Expected one EndHud $env:VERSION registered" }

      - name: The updated EndHud works
        shell: pwsh
        run: ./installer/self-test.ps1 -Exe "$env:LOCALAPPDATA\Programs\EndHud\EndHud.exe" -Folder "$env:RUNNER_TEMP\self-test-updated" -Screenshot tests/EndHud.Vision.Tests/Fixtures/exploration-levels-visible.png -Squad Laevatain,Camille,Arcane,Ardelia

      - name: The portable exe updates itself
        shell: pwsh
        run: |
          $dir = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\portable"
          Copy-Item old/EndHud-0.0.1-portable.exe "$dir\EndHud.exe"
          $p = Start-Process "$dir\EndHud.exe" -ArgumentList '--update-now', '--from', $env:FEED -Wait -PassThru
          Get-Content (Join-Path ([IO.Path]::GetTempPath()) 'EndHud-update\update-now.log')
          if ($p.ExitCode -ne 0) { throw "--update-now exited with $($p.ExitCode)" }
          $now = (Get-FileHash "$dir\EndHud.exe").Hash
          $expected = (Get-FileHash "release/EndHud-$env:VERSION-portable.exe").Hash
          if ($now -ne $expected) { throw 'EndHud.exe is not the new portable exe' }
          if (-not (Test-Path "$dir\EndHud.exe.old")) { throw 'The old exe was not kept aside' }
          "Portable EndHud.exe is now $((Get-Item "$dir\EndHud.exe").VersionInfo.ProductVersion)"

      - name: Collect the logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\update-logs" | Out-Null
          Get-ChildItem (Join-Path ([IO.Path]::GetTempPath()) 'EndHud-update') -Include *.log, *.txt -Recurse -ErrorAction SilentlyContinue |
            Copy-Item -Destination "$env:RUNNER_TEMP\update-logs"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-test-logs
          path: ${{ runner.temp }}/update-logs
          if-no-files-found: ignore

  release:
    needs: [build, verify, update]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EndHud-${{ needs.build.outputs.version }}
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" release/*
          --repo "${{ github.repository }}"
          --title "EndHud ${{ needs.build.outputs.version }}" --generate-notes
