# Keeps operators/operator-library.zip (the operator library EndHud ships and updates from)
# current: once a week, download the roster, avatars, skill icons and statuses from the wiki
# (endfield.wiki.gg) and rebuild the package. The package is reproducible, so an unchanged wiki
# gives the same bytes and nothing is proposed.
# A changed package is NOT pushed to main: players' EndHud picks up whatever is on main within a few
# hours (OperatorPackageSync), and the wiki can be edited by anyone. So the new package goes to the
# branch operator-package/refresh with a pull request, and reaches players only when someone has
# looked at it and merged it.
# The package also carries the inn's data (inn/: inn-data.json and pictures.zip, kept by hand), so a change to it on
# main rebuilds the package too.
name: Operator package

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  push:
    branches: [main]
    paths: ["inn/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-package
  cancel-in-progress: false

jobs:
  # Reads the wiki with no write access to anything: no token is kept in the checkout.
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Rebuild the package from the wiki and the inn data
        shell: pwsh
        run: dotnet run --project src/EndHud.Cli -c Release -- build-operator-package operators/operator-library.zip --inn inn
      - name: Did it change?
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- operators/operator-library.zip; then
            echo "Unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operator-package
          path: operators/operator-library.zip

  # Proposes the new package; never touches main.
  propose:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to push the branch operator-package/refresh
      pull-requests: write # to open the pull request
    env:
      BRANCH: operator-package/refresh
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: operator-package
          path: operators
      - name: Push the branch and open (or update) the pull request
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add operators/operator-library.zip
          git commit -m "Operator package: refreshed from the wiki and the inn data"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "Operator package: refreshed from the wiki and the inn data" \
              --body "Rebuilt by the weekly Operator package workflow from endfield.wiki.gg and inn/. Players get it only once this is merged: check the roster and pictures first."
          fi
