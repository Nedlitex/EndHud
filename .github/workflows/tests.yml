name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # run before every release (release.yml)

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      # The test data (screenshots, recordings) is the tests/data submodule (EndHud-test-data).
      # Large files are in Git LFS: the character model here (38 MB), the recordings there
      # (about 160 MB). Downloading counts against the LFS bandwidth quota, so LFS objects are
      # cached and only fetched when they change; checkout skips them.
      - uses: actions/checkout@v4
        with:
          submodules: true
        env:
          GIT_LFS_SKIP_SMUDGE: 1
      - name: List the LFS files (cache key)
        shell: bash
        run: |
          { git lfs ls-files --long; git -C tests/data lfs ls-files --long; } | cut -d ' ' -f1 | sort > .lfs-assets-id
      - name: Restore cached LFS files
        uses: actions/cache@v4
        with:
          path: |
            .git/lfs/objects
            .git/modules/tests/data/lfs/objects
          key: lfs-data-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-data-
      - name: Fetch LFS files
        run: |
          git lfs pull
          git -C tests/data lfs pull

      # The operator roster, avatars and skill icons come from the repository's operator package
      # (operators/operator-library.zip), which the tests unpack: nothing to download.

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # EndHud reads text with the OCR engine built into Windows, which needs an OCR language.
      - name: Install Windows OCR (English)
        shell: pwsh
        run: |
          $name = 'Language.OCR~~~en-US~0.0.1.0'
          if ((Get-WindowsCapability -Online -Name $name).State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $name | Out-Null
          }
          Get-WindowsCapability -Online -Name $name | Select-Object Name, State

      # The recordings are decoded with Windows' media stack (Media Foundation).
      - name: Install Media Foundation (video decoding)
        shell: pwsh
        run: |
          if (-not (Get-WindowsFeature Server-Media-Foundation).Installed) {
            Install-WindowsFeature Server-Media-Foundation | Out-Null
          }
          Get-WindowsFeature Server-Media-Foundation | Select-Object Name, InstallState

      - name: Build
        run: dotnet build -c Release

      # The real-capture tests (Category=Desktop) show a window and capture it with
      # Windows.Graphics.Capture, which hosted runners can't do: it fails there with "The service
      # did not respond" (no interactive desktop). They run on a developer machine only.
      # --blame-hang: a test still running after 10 minutes (one test takes seconds) is stopped and
      # named in the log, with a dump in the uploaded results. A run once sat 49 minutes in
      # OutOfTheBoxRecognitionTests until the job's 60-minute limit cancelled it, naming nothing.
      - name: Test
        run: >
          dotnet test -c Release --no-build --filter "Category!=Desktop"
          --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini
          --logger trx --logger "console;verbosity=normal" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
