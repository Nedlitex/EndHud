name: Fast release

# For when a release can't wait for the full pipeline (release.yml): builds EndHud and the MSI
# from the chosen commit and publishes them, WITHOUT the test suite, the clean-machine install
# and self-test, or the update test. Use it only when there's no time for the normal release;
# a normal release (push a tag like v1.2.0) still goes through all of release.yml.
#
# Run it from the Actions tab: "Fast release" -> Run workflow, with the version (1.2.0).
# It tags that commit v<version> and creates the GitHub Release. The tag is created by this
# workflow's token, so it does not start release.yml as well.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, three numbers (e.g. 0.6.0); tagged v<version>'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The character recognition model is compiled in (Git LFS); the recordings aren't needed.
      - name: Fetch the character model
        run: git lfs pull --include "src/EndHud.Vision/Assets/ccip/*"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      # The typed version reaches the script as an environment variable, never pasted into its text (a quote in it would
      # otherwise end the string and run the rest as PowerShell). FastReleaseWorkflowTests runs this step's script.
      - name: Version
        id: version
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          $version = "$env:VERSION_INPUT".Trim().TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Versions look like 1.2.0 (three numbers); got '$version'." }
          if ([version]$version -le [version]'0.0.1') { throw "Release versions must be above 0.0.1." }
          "VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "EndHud $version (fast release: no tests, no install or update checks)"

      # Every NuGet package checked against packages.lock.json; the publish then takes them from the NuGet cache
      # (it can't restore in locked mode itself: see release.yml).
      - name: Restore the locked packages
        run: dotnet restore EndHud.sln --locked-mode

      # One EndHud.exe with .NET included, so players don't need to install anything first.
      - name: Publish EndHud.exe
        run: >
          dotnet publish src/EndHud -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:Version=${{ env.VERSION }}
          -p:RestoreLockedMode=false -o out/publish

      - name: Build the installer
        run: |
          dotnet tool restore
          dotnet wix build installer/EndHud.wxs -arch x64 -define "Version=${{ env.VERSION }}" -define "PublishDir=${{ github.workspace }}\out\publish" -o "out\EndHud-${{ env.VERSION }}.msi"

      - name: Name the files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/release | Out-Null
          Move-Item "out/EndHud-$env:VERSION.msi" out/release/
          Copy-Item out/publish/EndHud.exe "out/release/EndHud-$env:VERSION-portable.exe"
          Get-ChildItem out/release | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EndHud-${{ env.VERSION }}
          path: out/release

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to tag the commit and create the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: EndHud-${{ needs.build.outputs.version }}
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ needs.build.outputs.version }}" release/*
          --repo "${{ github.repository }}" --target "${{ github.sha }}"
          --title "EndHud ${{ needs.build.outputs.version }}" --generate-notes
